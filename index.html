    <style>
      /* Hide Scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
      
      @keyframes breathing {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.02); }
      }
      @keyframes listening-antennae {
        0%, 100% { transform: rotate(-5deg); }
        50% { transform: rotate(5deg); }
      }
      @keyframes speaking-body {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-3px) scale(1.01); }
      }
      @keyframes speaking-mouth {
        0%, 100% { d: path('M 40 75 Q 50 80 60 75'); }
        50% { d: path('M 40 75 Q 50 88 60 75'); }
      }
      @keyframes thinking-glow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0)); }
        50% { filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.7)); }
      }
    </style>
